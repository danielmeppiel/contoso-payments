# APM policy for this repository. APM keeps its own keys; apmx reads only
# `factories`, from the pull request's BASE commit, so a PR cannot loosen it.
factories:
  # Definition digest of the one factory Contoso reviewed (the audit's Factory
  # row shows it): apmx-demo-factory v2.0.0 as run.yml resolves it
  # (repository, commit and content). No hermetic fixture is allowed here.
  allow:
    - "danielmeppiel/apmx-demo-factory#v2.0.0@sha256:f6c2d2401f3d343e5cc0eb0227bc72f5a30db242c4049ee6bbcc813f9a24eb2d"
  require_signed: true
  signers:
    # Every changed file must be covered by a signed verification summary from
    # apmx's reusable run.yml running in this repository (where the attestations
    # are stored), pinned to the run.yml release factory.yml calls: the tag and
    # the commit it must resolve to (`git rev-parse <tag>^{commit}`), because a
    # tag can move and this SHA cannot.
    - workflow: danielmeppiel/apmx/.github/workflows/run.yml@refs/tags/v0.8.0
      workflow_sha: "fae2067a0dc6ff07beda714015ff9e648f41ce63"
      repo: danielmeppiel/contoso-payments
  revoked: []
  enforcement: block
